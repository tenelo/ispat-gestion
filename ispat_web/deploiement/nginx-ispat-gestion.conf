# Nginx — ISPAT Gestion : application Angular (PWA) + API Django sur le même domaine.
# À copier dans /etc/nginx/sites-available/ puis : ln -s ... /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Remplacer gestion.ispat.ci par le domaine réel. Certificat HTTPS : certbot --nginx -d gestion.ispat.ci

server {
    listen 80;
    server_name gestion.ispat.ci;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gestion.ispat.ci;

    # Lignes ajoutées automatiquement par certbot :
    # ssl_certificate     /etc/letsencrypt/live/gestion.ispat.ci/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gestion.ispat.ci/privkey.pem;

    client_max_body_size 12m;          # photos et pièces jointes (5 Mo max par fichier côté API)

    # --- API Django (Gunicorn) ----------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;       # éditions PDF de classe entière
    }

    # Les fichiers (photos, pièces, bulletins) ne sont JAMAIS servis directement : l'API contrôle les droits.
    location /media/ { return 404; }

    # --- Application Angular --------------------------------------------------------------
    root /var/www/ispat-gestion;
    index index.html;

    # Fichiers du service worker et configuration : jamais en cache navigateur (mises à jour immédiates).
    location = /index.html            { add_header Cache-Control "no-cache"; }
    location = /ngsw.json             { add_header Cache-Control "no-cache"; }
    location = /ngsw-worker.js        { add_header Cache-Control "no-cache"; }
    location = /config.json           { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest  { add_header Cache-Control "no-cache"; default_type application/manifest+json; }

    # Fichiers compilés (noms avec empreinte) : cache long.
    location ~* \.(?:js|css|woff2?|png|ico|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Routes de l'application (/scolarite/..., /commercial/...) : renvoyées vers index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
