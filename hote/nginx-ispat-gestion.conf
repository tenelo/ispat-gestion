# Nginx du SERVEUR (hors Docker) — domaine ISPAT Gestion relayé vers le conteneur « web ».
# 1. Remplacer gestion.ispat.tenelo.cloud par le domaine réel (= DOMAINE du .env)
#    et 8090 par PORT_WEB si modifié.
# 2. cp nginx-ispat-gestion.conf /etc/nginx/sites-available/ispat-gestion
#    ln -s /etc/nginx/sites-available/ispat-gestion /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
# 3. certbot --nginx -d gestion.ispat.tenelo.cloud   (ajoute le bloc HTTPS et la redirection)

server {
    listen 80;
    listen [::]:80;
    server_name gestion.ispat.tenelo.cloud;

    client_max_body_size 12m;

    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # Remplace (n'ajoute pas) : l'adresse transmise à l'API ne peut pas être falsifiée par le client.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
