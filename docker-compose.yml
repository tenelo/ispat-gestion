# =====================================================================================
#  ISPAT Gestion — déploiement Docker (VPS)
#  Dossier sur le serveur : /root/docker/ispat-gestion/
#
#    db    PostgreSQL 16 (schéma ispat chargé au premier démarrage)
#    api   Django + Gunicorn (photos, pièces, bulletins dans le volume « media »)
#    web   Nginx : application Angular (PWA) + /api/ vers le conteneur api
#
#  Seul « web » est publié, et uniquement sur 127.0.0.1 : le Nginx du serveur (HTTPS, Certbot)
#  relaie le domaine vers ce port (voir hote/nginx-ispat-gestion.conf).
# =====================================================================================
name: ispat-gestion

services:
  db:
    container_name: db-ispat
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?à définir dans .env}
      DB_NAME: ${DB_NAME:-ispat_gestion}
      DB_USER: ${DB_USER:-ispat}
      DB_PASSWORD: ${DB_PASSWORD:?à définir dans .env}
      TZ: Africa/Abidjan
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/01_init.sh:/docker-entrypoint-initdb.d/01_init.sh:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-ispat_gestion}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [interne]

  api:
    container_name: ispat-api
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ispat-gestion-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?à définir dans .env}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DOMAINE:?à définir dans .env},api,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: https://${DOMAINE}
      DB_NAME: ${DB_NAME:-ispat_gestion}
      DB_USER: ${DB_USER:-ispat}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      MEDIA_ROOT: /data/media
      ISPAT_WP_SECRET: ${ISPAT_WP_SECRET:-}
      ISPAT_WP_IPS: ${ISPAT_WP_IPS:-}
      ISPAT_DERRIERE_PROXY: "True"
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-60}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      TZ: Africa/Abidjan
    volumes:
      - media:/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/sante/', timeout=4)"]
      interval: 20s
      timeout: 6s
      retries: 6
      start_period: 40s
    networks: [interne]

  web:
    container_name: ispat-app
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ispat-gestion-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT_WEB:-8090}:80"
    volumes:
      - ./web/config.json:/usr/share/nginx/html/config.json:ro
    networks: [interne]

volumes:
  db_data:
  media:

networks:
  interne:
