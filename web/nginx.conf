# Nginx du conteneur « web » : application Angular + relais /api/ vers Gunicorn.
# Le HTTPS est assuré par le Nginx du serveur (hote/nginx-ispat-gestion.conf).

upstream ispat_api {
    server api:8000;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 12m;          # photos et pièces jointes (5 Mo max par fichier côté API)
    server_tokens off;

    # --- API Django ----------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://ispat_api;
        proxy_set_header   Host              $host;
        # Adresse du client transmise par le Nginx du serveur (seul à pouvoir joindre ce port).
        proxy_set_header   X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;       # éditions PDF de classe entière
    }

    # Les fichiers (photos, pièces, bulletins) ne sont jamais servis directement : l'API contrôle les droits.
    location /media/ { return 404; }

    # --- Application Angular --------------------------------------------------------------
    root  /usr/share/nginx/html;
    index index.html;

    # Service worker et configuration : jamais en cache navigateur (mises à jour immédiates).
    location = /index.html            { add_header Cache-Control "no-cache"; }
    location = /ngsw.json             { add_header Cache-Control "no-cache"; }
    location = /ngsw-worker.js        { add_header Cache-Control "no-cache"; }
    location = /config.json           { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest  { add_header Cache-Control "no-cache"; default_type application/manifest+json; }

    # Fichiers compilés (noms avec empreinte) : cache long.
    location ~* \.(?:js|css|woff2?|png|ico|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Routes de l'application (/scolarite/..., /commercial/...) : renvoyées vers index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
